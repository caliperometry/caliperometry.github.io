<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caliperometry — Официальный сайт приложения</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #38bdf8; /* Голубой кибер-стиль */
            --accent-hover: #0ea5e9;
            --card-bg: #1e293b;
            --whop-color: #ff5a5f;
            --whop-hover: #e0484d;
            --border-color: #334155;
        }

        html {
            scroll-behavior: smooth;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            padding: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .nav-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .nav-link:hover {
            color: var(--accent-color);
        }

        /* Главный экран: Адаптивная двухколоночная сетка */
        .hero {
            padding: 80px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .hero-info h1 {
            font-size: 42px;
            margin-bottom: 15px;
            font-weight: 800;
            line-height: 1.2;
        }

        .hero-info p {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* Кнопка в стиле Google Play */
        .google-play-badge {
            display: inline-flex;
            align-items: center;
            background-color: #000000;
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            border: 1px solid #475569;
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
        }
        .google-play-badge:hover {
            background-color: #0b0f19;
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .badge-text {
            display: flex;
            flex-direction: column;
            margin-left: 12px;
            text-align: left;
        }
        .badge-text .top-txt {
            font-size: 10px;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        .badge-text .main-txt {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
        }

        /* Визуальный мокап смартфона для ноутбуков */
        .mockup-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .phone-mockup {
            width: 270px;
            height: 540px;
            background: #1e293b;
            border: 10px solid #334155;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-bottom-width: 14px;
            border-top-width: 14px;
        }
        .phone-screen-content {
            text-align: center;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 1px;
        }
        .phone-screen-content span {
            display: block;
            font-size: 13px;
            color: #64748b;
            margin-top: 8px;
            font-weight: normal;
        }

        /* Раздел FAQ */
        .faq-section {
            padding: 80px 0;
            border-top: 1px solid var(--border-color);
            max-width: 750px;
            margin: 0 auto;
        }

        .faq-section h2 {
            font-size: 32px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 800;
        }

        /* Стили выпадающих списков (аккордеон) */
        .faq-item {
            background-color: var(--card-bg);
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .faq-item:hover {
            border-color: #475569;
        }
        
        .faq-item summary {
            padding: 18px 24px;
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .faq-item summary::after {
            content: '+';
            font-size: 20px;
            color: var(--accent-color);
            transition: transform 0.2s;
            font-weight: bold;
        }
        .faq-item[open] summary::after {
            transform: rotate(45deg);
            color: var(--whop-color);
        }
        .faq-item summary::-webkit-details-marker {
            display: none;
        }
        
        .faq-content {
            padding: 0 24px 20px 24px;
            color: #cbd5e1;
            font-size: 15px;
            border-top: 1px solid #273549;
            padding-top: 15px;
        }

        /* Секция монетизации Whop */
        .premium-section {
            padding: 60px 20px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            background: linear-gradient(180deg, #0f172a 0%, #17153b 100%);
            border-radius: 16px;
            margin: 40px 0;
            border: 1px solid #1e1b4b;
        }

        .premium-section h2 {
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .premium-section p {
            color: #94a3b8;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            font-size: 16px;
        }

        .whop-button {
            display: inline-block;
            background-color: var(--whop-color);
            color: white;
            padding: 16px 44px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 10px 25px rgba(255, 90, 95, 0.25);
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .whop-button:hover {
            background-color: var(--whop-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 90, 95, 0.4);
        }

        footer {
            padding: 40px 0;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            border-top: 1px solid #1e293b;
        }
        .footer-links a {
            color: #64748b;
            margin: 0 12px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-links a:hover {
            color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 40px 0;
                gap: 30px;
            }
            .hero-info h1 {
                font-size: 32px;
            }
            .hero-info p {
                font-size: 16px;
            }
            .mockup-container {
                order: -1;
            }
            .phone-mockup {
                width: 220px;
                height: 440px;
            }
            .faq-section h2, .premium-section h2 {
                font-size: 26px;
            }
            .faq-item summary {
                padding: 16px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>
